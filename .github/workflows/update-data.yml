name: Update STEVE Data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch STEVE status
        run: |
          code=$(curl -s -o /tmp/status.json -w "%{http_code}" --max-time 30 --retry 2 --retry-delay 10 "${{ secrets.STEVE_API_URL }}") || code="curl_err_$?"
          echo "HTTP: $code"
          if [ "$code" = "200" ] && python3 -c "import json;d=json.load(open('/tmp/status.json'));assert 'workspaces' in d"; then
            cp /tmp/status.json data/steve_status.json
            echo "dati aggiornati"
          else
            echo "fetch fallito, mantengo i dati precedenti"
          fi
      - name: Commit if changed
        run: |
          cd $GITHUB_WORKSPACE
          git config user.name "STEVE Bot"
          git config user.email "steve.bot.project@gmail.com"
          git add data/steve_status.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: update $(date -u +%Y-%m-%dT%H:%M)"
            git push
          fi
